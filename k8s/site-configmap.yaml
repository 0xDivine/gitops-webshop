apiVersion: v1
kind: ConfigMap
metadata:
  name: webshop-site
  namespace: webshop
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaShop</title><link rel="stylesheet" href="style.css"></head>
    <body>
    <header class="topbar"><a class="brand" href="#">NovaShop</a><button class="cart" id="cartButton">Cart <span id="cartCount">0</span></button></header>
    <main><section class="hero"><p class="eyebrow">Kubernetes-powered storefront</p><h1>Simple tech. Clean design.</h1><p>Discover a small collection of everyday tech essentials.</p></section><section class="products" id="products"></section></main>
    <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel"><div class="drawer-head"><h2>Your cart</h2><button id="closeCart">×</button></div><div id="cartItems"></div><div class="total"><span>Total</span><strong id="cartTotal">€0.00</strong></div></div></div>
    <script src="app.js"></script></body></html>
  style.css: |
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#16181d}.topbar{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 7vw;position:sticky;top:0;z-index:10}.brand{font-size:1.35rem;font-weight:800;text-decoration:none;color:#111827}.cart{border:0;background:#111827;color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}.hero{padding:80px 7vw 42px;max-width:900px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:#6b7280;font-weight:800}.hero h1{font-size:clamp(2.5rem,6vw,4.8rem);line-height:.98;margin:14px 0}.hero p:not(.eyebrow){font-size:1.1rem;color:#667085;max-width:620px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:10px 7vw 70px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px;display:flex;flex-direction:column}.art{aspect-ratio:1;background:linear-gradient(145deg,#eef2ff,#dbeafe);border-radius:14px;display:grid;place-items:center;font-size:4rem}.card h3{margin:18px 0 6px}.card p{margin:0 0 16px;color:#667085;min-height:40px}.price{font-weight:800;font-size:1.15rem;margin-bottom:14px}.buy{margin-top:auto;border:0;background:#111827;color:#fff;padding:12px;border-radius:12px;cursor:pointer;font-weight:700}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;z-index:20}.drawer.open{display:block}.drawer-panel{margin-left:auto;width:min(420px,92vw);height:100%;background:#fff;padding:24px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head button{border:0;background:none;font-size:2rem;cursor:pointer}.item{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #eee}.item small{color:#667085}.total{display:flex;justify-content:space-between;padding-top:20px;font-size:1.1rem}
  app.js: |
    const products=[{name:"Wireless Headphones",price:129,icon:"◉",desc:"Comfortable everyday audio."},{name:"Mechanical Keyboard",price:99,icon:"⌨",desc:"Clean desk setup with linear switches."},{name:"4K Webcam",price:79,icon:"◉",desc:"Sharp video for calls and streaming."},{name:"USB-C Hub",price:49,icon:"▦",desc:"One compact hub for your setup."},{name:"Portable SSD",price:89,icon:"▣",desc:"Fast storage for work and play."},{name:"Desk Lamp",price:39,icon:"◐",desc:"Soft lighting for focused sessions."}];const cart=[];const p=document.getElementById("products"),cc=document.getElementById("cartCount"),ci=document.getElementById("cartItems"),ct=document.getElementById("cartTotal"),d=document.getElementById("drawer");const money=v=>new Intl.NumberFormat("en-NL",{style:"currency",currency:"EUR"}).format(v);function renderProducts(){p.innerHTML=products.map((x,i)=>`<article class="card"><div class="art">${x.icon}</div><h3>${x.name}</h3><p>${x.desc}</p><div class="price">${money(x.price)}</div><button class="buy" onclick="addToCart(${i})">Add to cart</button></article>`).join("")}function addToCart(i){cart.push(products[i]);renderCart()}function removeFromCart(i){cart.splice(i,1);renderCart()}function renderCart(){cc.textContent=cart.length;ci.innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><div><strong>${x.name}</strong><br><small>${money(x.price)}</small></div><button onclick="removeFromCart(${i})">Remove</button></div>`).join(""):"<p>Your cart is empty.</p>";ct.textContent=money(cart.reduce((s,x)=>s+x.price,0))}document.getElementById("cartButton").onclick=()=>d.classList.add("open");document.getElementById("closeCart").onclick=()=>d.classList.remove("open");renderProducts();renderCart();
